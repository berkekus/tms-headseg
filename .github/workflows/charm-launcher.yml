name: Build CHARM launcher

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install launcher and build dependencies
        run: python -m pip install -r tools/charm_gui/requirements-build.txt
      - name: Check process lifecycle and interface
        run: python -m unittest discover -s tools/charm_gui -v
      - name: Build desktop package
        run: python tools/charm_gui/build.py
      - name: Smoke-test Windows package
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $app = Join-Path $PWD 'tools/charm_gui/dist/CHARM Launcher/CHARM Launcher.exe'
          $process = Start-Process -FilePath $app -ArgumentList '--smoke-test' -PassThru
          if (-not $process.WaitForExit(30000)) {
            $process.Kill()
            throw 'Packaged launcher did not exit within 30 seconds.'
          }
          if ($process.ExitCode -ne 0) { throw "Launcher exited with $($process.ExitCode)" }
      - name: Smoke-test macOS package
        if: runner.os == 'macOS'
        run: '"tools/charm_gui/dist/CHARM Launcher.app/Contents/MacOS/CHARM Launcher" --smoke-test'
      - uses: actions/upload-artifact@v4
        with:
          name: charm-launcher-${{ runner.os }}-${{ runner.arch }}
          path: tools/charm_gui/dist/*.zip
          if-no-files-found: error
          retention-days: 14
