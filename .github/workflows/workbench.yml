name: Workbench checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  macos-startup:
    runs-on: macos-15
    timeout-minutes: 12
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Install existing desktop requirements
        run: python -m pip install -r tools/mri_prototype/requirements.txt
      - name: Check startup diagnostics and command path handling
        run: |
          python -m unittest discover -s tools/mri_prototype -p test_launch.py -v
          python -m unittest discover -s tools/mri_prototype -p test_command_launcher.py -v
      - name: Open Workbench through the macOS entry point
        run: './"Open MRI Workbench.command" --smoke-test'

  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Install Linux Qt graphics runtime
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libegl1 libgl1 libopengl0 libxkbcommon0
      - name: Install existing desktop requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r tools/mri_prototype/requirements.txt
      - name: Check synthetic desktop, geometry integration and startup
        run: python -m unittest discover -s tools/mri_prototype -v
